<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0a0c0f" />
<title>Commander life</title>
<style>
  :root{
    --bg:#08090c;
    --gutter:#000;
    --coin-bg:rgba(16,18,22,0.62);
    --chip-bg:rgba(10,11,14,0.55);
    --sheet:#15181d;
    --sheet-row:#1d2128;
    --line:rgba(255,255,255,0.10);
    --text:#f2f4f7;
    --muted:rgba(255,255,255,0.62);
    --danger:#ff5b5b;
    --active:#555;
    --gap:5px;
    --coin: clamp(118px, 28vw, 158px);
    --coin-border: 8px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,system-ui,sans-serif;
    overflow:hidden;-webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;touch-action:none;
  }
  /* size to the *visible* viewport (excludes the browser bar) so the coin is
     centred in what the player actually sees; --app-h is refined in JS */
  #app{position:fixed;left:0;top:0;width:100%;height:100dvh;height:var(--app-h,100dvh)}
  .board{position:absolute;inset:0;background:var(--gutter)}
  #rows{position:absolute;inset:0;display:flex;flex-direction:column;gap:var(--gap);background:var(--gutter)}
  .row{flex:1;display:flex;gap:var(--gap);min-height:0}
  .tile{
    flex:1;position:relative;overflow:hidden;min-width:0;
    background:var(--tile,#333);color:var(--fg,#fff);
    display:grid;place-items:center;
    transition:filter .18s ease, box-shadow .2s ease;
  }
  .tile.rot{transform:rotate(180deg)}
  /* active player's box while their clock runs: an animated rainbow ring.
     A flowing LINEAR gradient is used on purpose (no conic gradient): mobile
     Chromium browsers render a dark band at the conic seam, so we avoid conic
     entirely. The parent masks the gradient to a thin ring; the gradient
     scrolls diagonally and its red ends match, so the flow is continuous. */
  .tile .rb{
    position:absolute;inset:0;z-index:2;pointer-events:none;display:none;overflow:hidden;
    padding:8px;
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    mask-composite:exclude;
  }
  .tile.turn .rb{display:block}
  .tile .rb::before{
    content:"";position:absolute;inset:0;
    background:linear-gradient(60deg,
      #ff3b3b,#ff9d00,#ffe000,#34e24a,#16dada,#2d7bff,#9b3dff,#ff3db0,#ff3b3b);
    background-size:200% 200%;
    animation:rbFlow 5s linear infinite;
  }
  @keyframes rbFlow{from{background-position:0% 0%}to{background-position:200% 200%}}
  .tile .life{
    font-size:clamp(54px, 19vw, 150px);font-weight:800;line-height:1;
    font-variant-numeric:tabular-nums;letter-spacing:-0.03em;
    pointer-events:none;opacity:.97;position:relative;z-index:3;
    transition:transform .2s ease;
  }
  /* tall tiles: the number is rotated a quarter turn so it runs along the
     longer side; the exact rotation (and font size) is set per tile in JS so
     it reads upright for the player seated on that long edge (left/right) */
  /* default (wide tiles): split along the vertical centre line, left −, right + */
  .zone{position:absolute;top:0;bottom:0;width:50%;height:auto;touch-action:none;cursor:pointer;background:transparent;outline:none}
  .zone.dec{left:0;right:auto}
  .zone.inc{right:0;left:auto}
  /* tall tiles: split along the horizontal centre line, top +, bottom − */
  .tile.tall .zone{left:0;right:0;top:auto;bottom:auto;width:auto;height:50%}
  .tile.tall .zone.inc{top:0}
  .tile.tall .zone.dec{bottom:0}
  .zone .sign{
    position:absolute;top:50%;transform:translateY(-50%);
    font-size:clamp(26px,7vw,48px);font-weight:700;color:var(--fg,#fff);
    opacity:0;transition:opacity .12s ease;pointer-events:none;
  }
  .zone.dec .sign{left:11%}
  .zone.inc .sign{right:11%}
  .tile.tall .zone .sign{top:auto;bottom:auto;left:50%;right:auto;transform:translateX(-50%)}
  .tile.tall .zone.inc .sign{top:8%}
  .tile.tall .zone.dec .sign{bottom:8%}
  .zone.pressing .sign{opacity:.32}
  .zone:focus-visible{box-shadow:inset 0 0 0 3px rgba(255,255,255,.5)}
  .delta{
    position:absolute;top:15%;left:50%;transform:translate(-50%,-6px);
    background:var(--chip-bg);color:#fff;border:1px solid rgba(255,255,255,.16);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    padding:4px 12px;border-radius:999px;font-size:clamp(14px,4vw,20px);font-weight:600;
    font-variant-numeric:tabular-nums;pointer-events:none;
    opacity:0;transition:opacity .25s ease, transform .25s ease;
  }
  .delta.show{opacity:1;transform:translate(-50%,0)}
  .badge{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.6);
    background:#fff;color:#111;border-radius:999px;padding:7px 16px;
    font-weight:700;font-size:clamp(18px,5vw,26px);
    opacity:0;transition:opacity .25s ease, transform .25s ease;
    pointer-events:none;box-shadow:0 6px 24px rgba(0,0,0,.45);z-index:6;
  }
  .badge.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  .badge.second{font-size:clamp(14px,4vw,20px);background:rgba(255,255,255,.92)}

  .board.rolling .tile{filter:brightness(.34) saturate(.85)}
  .board.rolling .tile.spot{filter:none;box-shadow:inset 0 0 0 4px rgba(255,255,255,.85)}
  .board.rolling .tile.first{filter:none;box-shadow:inset 0 0 0 5px #fff}

  /* central timer bar: a full-width rectangle in the flow between the top and
     bottom player groups (Design A) */
  .coin{
    flex:0 0 auto;width:100%;height:clamp(58px,9.5vh,80px);border-radius:14px;
    background:var(--coin-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:2px solid var(--active);
    display:flex;flex-direction:row;align-items:center;justify-content:center;gap:14px;
    position:relative;z-index:5;cursor:pointer;touch-action:none;
    box-shadow:0 6px 22px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.06);
    transition:border-color .25s ease, background-color .25s ease, opacity .2s ease;
  }
  .coin.hidden{opacity:0;pointer-events:none}
  /* arrow on the ring that rotates to point at the active player's tile,
     so the active player is identified by position even if colours collide */
  /* directional arrow is not used in the bar layout (active player is shown by
     the rainbow box border and the bar's colour) */
  .coin .pointer{display:none}
  .coin .pointer_unused{
    position:absolute;inset:calc(var(--coin-border) * -1);
    pointer-events:none;z-index:7;transform:rotate(0deg);
    transition:transform .45s cubic-bezier(.2,.8,.2,1), opacity .25s ease;
    animation:ptrHue var(--ptr-cycle,6s) linear infinite;
  }
  .coin .pointer.hidden{opacity:0}
  .coin .pointer::before{
    content:"";position:absolute;left:50%;top:-9px;transform:translateX(-50%);
    border-left:14px solid transparent;border-right:14px solid transparent;
    border-bottom:19px solid hsl(0,90%,55%);
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.7));
  }
  @keyframes ptrHue{ from{filter:hue-rotate(0deg)} to{filter:hue-rotate(360deg)} }
  .coin .turn{font-size:clamp(24px,6.6vw,34px);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.01em}
  .coin .total{font-size:clamp(12px,3.4vw,16px);color:var(--muted);font-variant-numeric:tabular-nums}
  .coin.paused .turn,.coin.paused .total{color:var(--danger)}

  #hint{
    position:fixed;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);
    color:var(--text);font-size:14px;font-weight:600;letter-spacing:.02em;
    background:rgba(10,11,14,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    padding:8px 16px;border-radius:999px;border:1px solid var(--line);
    opacity:0;transition:opacity .25s ease;pointer-events:none;z-index:20
  }
  #hint.show{opacity:1}
  #skip{position:fixed;inset:0;z-index:15;background:transparent;display:none}
  #skip.show{display:block}

  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
    z-index:30;opacity:0;pointer-events:none;transition:opacity .2s ease}
  .overlay.show{opacity:1;pointer-events:auto}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:31;
    background:var(--sheet);border-radius:22px 22px 0 0;
    padding:10px 18px calc(18px + env(safe-area-inset-bottom));
    max-height:88dvh;overflow:auto;overscroll-behavior:contain;touch-action:auto;
    transform:translateY(102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
    box-shadow:0 -10px 40px rgba(0,0,0,.5)
  }
  .sheet.show{transform:translateY(0)}
  .grab{width:38px;height:4px;border-radius:2px;background:rgba(255,255,255,.22);margin:6px auto 12px}
  .sheet h2{font-size:18px;font-weight:600;margin:2px 2px 14px}
  .srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 2px;border-top:1px solid var(--line)}
  .srow:first-of-type{border-top:0}
  .srow .lab{font-size:15px;color:var(--text)}
  .seg{display:flex;background:var(--sheet-row);border-radius:11px;padding:3px;gap:2px}
  .seg button{
    border:0;background:transparent;color:var(--muted);font:inherit;font-size:14px;font-weight:600;
    padding:7px 12px;border-radius:8px;cursor:pointer;min-width:38px
  }
  .seg button.on{background:#3a3f49;color:#fff}
  .stepper{display:flex;align-items:center;gap:6px;background:var(--sheet-row);border-radius:11px;padding:3px}
  .stepper button{width:34px;height:32px;border:0;border-radius:8px;background:transparent;color:#fff;font-size:20px;cursor:pointer}
  .stepper button:active{background:#3a3f49}
  .stepper .val{min-width:34px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
  #playerList{margin-top:4px}
  .prow{padding:11px 2px;border-top:1px solid var(--line)}
  .prow .head{display:flex;align-items:center;gap:12px}
  .swatch{width:26px;height:26px;border-radius:8px;border:2px solid rgba(255,255,255,.25);cursor:pointer;flex:0 0 auto}
  .prow input.name{
    flex:1;min-width:0;background:transparent;border:0;border-bottom:1px solid var(--line);
    color:var(--text);font:inherit;font-size:15px;padding:5px 2px;border-radius:0
  }
  .prow input.name:focus{outline:none;border-bottom-color:rgba(255,255,255,.45)}
  .picker{display:none;flex-wrap:wrap;gap:9px;padding:12px 2px 4px}
  .picker.open{display:flex}
  .picker .opt{width:30px;height:30px;border-radius:8px;border:2px solid transparent;cursor:pointer}
  .picker .opt.sel{border-color:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.5)}
  .reset{
    width:100%;margin-top:18px;padding:15px;border-radius:13px;border:1px solid rgba(255,91,91,.4);
    background:rgba(255,91,91,.12);color:#ff7a7a;font:inherit;font-size:16px;font-weight:600;cursor:pointer
  }
  .reset.confirm{background:#ff5b5b;color:#fff;border-color:#ff5b5b}
  .done{width:100%;margin-top:10px;padding:13px;border-radius:13px;border:1px solid var(--line);background:transparent;color:var(--muted);font:inherit;font-size:15px;cursor:pointer}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;animation:none !important}
  }
</style>
</head>
<body>
<div id="app">
  <div class="board" data-testid="board">
    <div id="rows"></div>
    <div class="coin" data-testid="coin" aria-label="Turn timer">
      <div class="pointer hidden" data-testid="turn-pointer" aria-hidden="true"></div>
      <div class="turn" data-testid="turn-time">0:00</div>
      <div class="total" data-testid="total-time">0:00</div>
    </div>
  </div>
</div>

<div id="hint">Rolling for who goes first…</div>
<div id="skip" data-testid="skip" aria-label="Skip"></div>

<div class="overlay" data-testid="overlay"></div>
<div class="sheet" data-testid="settings" role="dialog" aria-label="Settings">
  <div class="grab"></div>
  <h2>Settings</h2>
  <div class="srow">
    <span class="lab">Players</span>
    <div class="seg" id="countSeg"></div>
  </div>
  <div class="srow">
    <span class="lab">Starting life</span>
    <div class="stepper">
      <button data-testid="life-dec" aria-label="Decrease starting life">–</button>
      <span class="val" data-testid="life-val">40</span>
      <button data-testid="life-inc" aria-label="Increase starting life">+</button>
    </div>
  </div>
  <div class="srow">
    <span class="lab">Hide change after</span>
    <div class="stepper">
      <button data-testid="delta-dec" aria-label="Decrease delta fade time">–</button>
      <span class="val" data-testid="delta-val">10s</span>
      <button data-testid="delta-inc" aria-label="Increase delta fade time">+</button>
    </div>
  </div>
  <div class="srow">
    <span class="lab">Direction</span>
    <div class="seg" id="dirSeg">
      <button data-testid="dir-cw" data-dir="cw">↻ CW</button>
      <button data-testid="dir-ccw" data-dir="ccw">↺ CCW</button>
    </div>
  </div>
  <div id="playerList"></div>
  <button class="reset" data-testid="reset">Reset game</button>
  <button class="done" data-testid="settings-done">Done</button>
</div>

<script>
(function(){
  "use strict";

  // ---- config / test seams (URL params) -------------------------------
  var Q = new URLSearchParams(location.search);
  var qNum = function(k, d){ var v = parseInt(Q.get(k),10); return isNaN(v) ? d : v; };
  var CFG = {
    fadeMs:   qNum("fadeMs", 10000),   // delta chip auto-clear
    holdMs:   qNum("holdMs", 350),     // hold before repeat begins
    repMin:   qNum("repMin", 55),      // fastest repeat interval
    repMax:   qNum("repMax", 180),     // starting repeat interval
    dblMs:    qNum("dblMs", 250),      // single vs double tap window on coin
    tickMs:   200,
    nosplash: Q.has("nosplash"),
    fresh:    Q.has("fresh"),
    seed:     Q.has("seed") ? (qNum("seed",1) >>> 0) : null
  };
  var reduceMotion = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

  // ---- palette ---------------------------------------------------------
  var PALETTE = {
    crimson:"#C0392B", azure:"#2471C7", emerald:"#1E9E54", amber:"#D4A017",
    violet:"#7D4FC0", teal:"#179B94", slate:"#39414E", rose:"#C2477A",
    orange:"#D2733A", sky:"#3AA0D9", paper:"#E9E4D6", forest:"#2F6B3A"
  };
  var COLOR_ORDER = ["crimson","azure","emerald","amber","violet","teal","slate","rose","orange","sky","paper","forest"];
  function fgFor(hex){
    var r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
    var lum=(0.299*r+0.587*g+0.114*b)/255;
    return lum>0.62 ? "#15130c" : "#ffffff";
  }

  // ---- state -----------------------------------------------------------
  var STORE_KEY = "mtg-commander-tracker-v1";
  var S = {
    count: 4,
    startingLife: 40,
    direction: "cw",
    deltaFadeMs: CFG.fadeMs,  // how long the +/- change chip stays visible
    ptrCycleSec: 6,           // seconds for one full hue cycle of the turn arrow
    players: [],            // {name, color}
    life: [],               // per player
    totals: [],             // banked ms per player
    active: null,           // index or null
    paused: false,
    phase: "idle",          // idle | rolling | playing
    turnAccum: 0,           // ms accumulated in current turn (running portions)
    segStart: null          // timestamp when current running segment began
  };
  var deltaSum = [];         // per player, since last commit
  var fadeTimer = [];        // per player

  function defaultPlayers(n){
    var arr=[];
    for(var i=0;i<n;i++){
      arr.push({ name:"Player "+(i+1), color: COLOR_ORDER[i % COLOR_ORDER.length] });
    }
    return arr;
  }

  // ---- persistence (guarded; degrades to in-memory) --------------------
  function save(){
    try{
      var data = {
        count:S.count, startingLife:S.startingLife, direction:S.direction,
        deltaFadeMs:S.deltaFadeMs, ptrCycleSec:S.ptrCycleSec,
        players:S.players, life:S.life, totals:S.totals, active:S.active,
        paused:S.paused, turnAccum:currentTurn()
      };
      localStorage.setItem(STORE_KEY, JSON.stringify(data));
    }catch(e){/* storage unavailable */}
  }
  function load(){
    if(CFG.fresh) return null;
    try{
      var raw = localStorage.getItem(STORE_KEY);
      if(!raw) return null;
      var d = JSON.parse(raw);
      if(!d || !Array.isArray(d.players)) return null;
      return d;
    }catch(e){ return null; }
  }

  // ---- rng -------------------------------------------------------------
  var _seed = CFG.seed;
  function rnd(){
    if(_seed===null) return Math.random();
    _seed |= 0; _seed = (_seed + 0x6D2B79F5) | 0;
    var t = Math.imul(_seed ^ (_seed >>> 15), 1 | _seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  function pickFirst(){ return Math.floor(rnd()*S.count) % S.count; }

  // Seating ring: players ordered by the angle of their tile around the board
  // centre, so turns follow the physical clockwise/counter-clockwise layout on
  // screen instead of the internal index order (which could skip across seats).
  var seatOrder = [];   // clockwise list of player indices
  var seatRank = [];    // player index -> position within seatOrder
  function computeSeatOrder(){
    // order seats by angle around the coin (the visual centre of the ring)
    var c = el.coin.getBoundingClientRect();
    var cx = c.left + c.width/2, cy = c.top + c.height/2;
    var arr = [];
    for(var i=0;i<S.count;i++){
      var t = tileEls[i]; if(!t) continue;
      var r = t.tile.getBoundingClientRect();
      // atan2 with screen (y-down) coords increases clockwise from north
      var ang = Math.atan2((r.top+r.height/2)-cy, (r.left+r.width/2)-cx);
      arr.push({ i:i, ang:ang });
    }
    arr.sort(function(a,b){ return a.ang - b.ang; });
    seatOrder = arr.map(function(o){ return o.i; });
    seatRank = [];
    seatOrder.forEach(function(idx, pos){ seatRank[idx] = pos; });
  }
  function nextIndex(i){
    if(!seatOrder.length || seatRank[i]==null){
      return S.direction==="cw" ? (i+1)%S.count : (i-1+S.count)%S.count;
    }
    var step = S.direction==="cw" ? 1 : -1;
    var pos = (seatRank[i] + step + seatOrder.length) % seatOrder.length;
    return seatOrder[pos];
  }
  function directionOrder(){
    var base = seatOrder.length ? seatOrder.slice() : (function(){ var o=[]; for(var i=0;i<S.count;i++) o.push(i); return o; })();
    if(S.direction!=="cw") base.reverse();
    return base;
  }

  // ---- dom refs --------------------------------------------------------
  var el = {
    board: document.querySelector('[data-testid="board"]'),
    rows: document.getElementById("rows"),
    coin: document.querySelector('[data-testid="coin"]'),
    pointer: document.querySelector('[data-testid="turn-pointer"]'),
    turn: document.querySelector('[data-testid="turn-time"]'),
    total: document.querySelector('[data-testid="total-time"]'),
    overlay: document.querySelector('[data-testid="overlay"]'),
    sheet: document.querySelector('[data-testid="settings"]'),
    countSeg: document.getElementById("countSeg"),
    dirSeg: document.getElementById("dirSeg"),
    lifeVal: document.querySelector('[data-testid="life-val"]'),
    lifeDec: document.querySelector('[data-testid="life-dec"]'),
    lifeInc: document.querySelector('[data-testid="life-inc"]'),
    deltaVal: document.querySelector('[data-testid="delta-val"]'),
    deltaDec: document.querySelector('[data-testid="delta-dec"]'),
    deltaInc: document.querySelector('[data-testid="delta-inc"]'),
    playerList: document.getElementById("playerList"),
    reset: document.querySelector('[data-testid="reset"]'),
    done: document.querySelector('[data-testid="settings-done"]'),
    hint: document.getElementById("hint"),
    skip: document.querySelector('[data-testid="skip"]')
  };

  // ---- layout (Design A) -----------------------------------------------
  // A full-width timer bar splits the screen into a top group and a bottom
  // group of player boxes. Top group faces the top edge (rotated 180). Numbers
  // are centred in each box; the bar has its own space so nothing is covered.
  function layoutFor(n){
    switch(n){
      case 2: return { top:[0],     bottom:[1] };
      case 3: return { top:[0],     bottom:[1,2] };
      case 4: return { top:[0,1],   bottom:[2,3] };
      case 5: return { top:[0,1],   bottom:[2,3,4] };
      case 6: return { top:[0,1,2], bottom:[3,4,5] };
      default:return { top:[0,1],   bottom:[2,3] };
    }
  }

  var tileEls = []; // index -> {tile, life, delta, badge}

  function buildBoard(){
    el.rows.innerHTML = "";
    tileEls = [];
    var L = layoutFor(S.count);

    function makeTile(i, rot){
      var tile = document.createElement("div");
      tile.className = "tile" + (rot ? " rot" : "");
      tile.setAttribute("data-testid","tile");
      tile.setAttribute("data-player-index", String(i));
      tile.setAttribute("data-rotated", rot ? "true" : "false");

      var dec = document.createElement("div");
      dec.className = "zone dec";
      dec.setAttribute("data-testid","dec");
      dec.setAttribute("role","button");
      dec.setAttribute("tabindex","0");
      dec.setAttribute("aria-label","Decrease "+S.players[i].name+" life");
      dec.innerHTML = '<span class="sign">–</span>';

      var inc = document.createElement("div");
      inc.className = "zone inc";
      inc.setAttribute("data-testid","inc");
      inc.setAttribute("role","button");
      inc.setAttribute("tabindex","0");
      inc.setAttribute("aria-label","Increase "+S.players[i].name+" life");
      inc.innerHTML = '<span class="sign">+</span>';

      var delta = document.createElement("div");
      delta.className = "delta";
      delta.setAttribute("data-testid","delta");

      var life = document.createElement("div");
      life.className = "life";
      life.setAttribute("data-testid","life");

      var badge = document.createElement("div");
      badge.className = "badge";
      badge.setAttribute("data-testid","badge");

      var rb = document.createElement("div");   // rainbow ring for the active player
      rb.className = "rb";

      tile.appendChild(dec);
      tile.appendChild(inc);
      tile.appendChild(delta);
      tile.appendChild(life);
      tile.appendChild(badge);
      tile.appendChild(rb);

      tileEls[i] = { tile:tile, life:life, delta:delta, badge:badge, dec:dec, inc:inc };
      wireZone(dec, i, -1);
      wireZone(inc, i, +1);
      applyTileColor(i);
      return tile;
    }
    function makeRow(indices, rot){
      var row = document.createElement("div");
      row.className = "row";
      indices.forEach(function(i){ row.appendChild(makeTile(i, rot)); });
      return row;
    }

    // top group, then the timer bar, then the bottom group
    el.rows.appendChild(makeRow(L.top, true));
    el.rows.appendChild(el.coin);   // move the timer bar into the flow
    el.rows.appendChild(makeRow(L.bottom, false));

    updateTiles();
    computeSeatOrder();      // tiles exist now; derive the clockwise seating ring
    applyTileOrientation();  // centre + size each number
    updateCoin();
  }

  // Align each number along the box's longest edge: clearly tall boxes get a
  // quarter turn so the number runs vertically (left column reads from the
  // left, right column from the right); near-square / wide boxes stay upright.
  // Sized for up to 3 digits. The timer bar has its own band, nothing overlaps.
  function applyTileOrientation(){
    var b = el.board.getBoundingClientRect();
    var midX = b.left + b.width/2;
    for(var i=0;i<S.count;i++){
      var t = tileEls[i]; if(!t) continue;
      var r = t.tile.getBoundingClientRect();
      t.tile.classList.toggle("tall", r.height > r.width);   // drives the +/- split
      var rot = t.tile.classList.contains("rot");
      if(r.height > r.width*1.1){
        // rotated: glyph height bound by box width, number length by box height
        var px = Math.min(r.width*0.82, r.height/1.9, 240);
        t.life.style.fontSize = Math.round(Math.max(20, px)) + "px";
        var leftCol = (r.left + r.width/2) < midX - 1;
        t.life.style.transform = "rotate(" + ((leftCol ? 90 : -90) - (rot ? 180 : 0)) + "deg)";
      } else {
        var px2 = Math.min(r.height*0.6, r.width/1.7, 200);
        t.life.style.fontSize = Math.round(Math.max(20, px2)) + "px";
        t.life.style.transform = "";
      }
    }
  }

  function applyTileColor(i){
    var hex = PALETTE[S.players[i].color] || "#333";
    tileEls[i].tile.style.setProperty("--tile", hex);
    tileEls[i].tile.style.setProperty("--fg", fgFor(hex));
    tileEls[i].tile.setAttribute("data-color", S.players[i].color);
  }

  function updateTiles(){
    for(var i=0;i<S.count;i++){
      var t = tileEls[i]; if(!t) continue;
      t.life.textContent = String(S.life[i]);
      t.tile.setAttribute("data-life", String(S.life[i]));
      var d = deltaSum[i] || 0;
      t.tile.setAttribute("data-delta", String(d));
      t.tile.setAttribute("data-active", S.active===i ? "true" : "false");
      // rainbow border only on the active player while their clock is running
      t.tile.classList.toggle("turn", S.active===i && S.phase==="playing" && !S.paused);
    }
  }

  // ---- life changes ----------------------------------------------------
  var press = {}; // index -> {holdTimer, repTimer, interval, dir}

  function applyChange(i, dir){
    S.life[i] += dir;
    deltaSum[i] = (deltaSum[i]||0) + dir;
    var t = tileEls[i];
    t.life.textContent = String(S.life[i]);
    t.tile.setAttribute("data-life", String(S.life[i]));
    var d = deltaSum[i];
    t.delta.textContent = (d>0?"+":"") + d;
    t.delta.classList.add("show");
    t.tile.setAttribute("data-delta", String(d));
    armFade(i);
    save();
  }
  function armFade(i){
    if(fadeTimer[i]) clearTimeout(fadeTimer[i]);
    fadeTimer[i] = setTimeout(function(){
      deltaSum[i] = 0;
      tileEls[i].delta.classList.remove("show");
      tileEls[i].tile.setAttribute("data-delta","0");
    }, S.deltaFadeMs);
  }
  function startPress(e, i, dir){
    if(S.phase==="rolling") return;
    e.preventDefault();
    try{ if(e.pointerId!=null) e.target.setPointerCapture(e.pointerId); }catch(_){}
    var z = tileEls[i][dir<0?"dec":"inc"]; z.classList.add("pressing");
    applyChange(i, dir);
    var st = press[i] = { dir:dir, interval:CFG.repMax, zone:z };
    st.holdTimer = setTimeout(function repeat(){
      applyChange(i, dir);
      st.interval = Math.max(CFG.repMin, Math.round(st.interval*0.84));
      st.repTimer = setTimeout(repeat, st.interval);
    }, CFG.holdMs);
  }
  function endPress(i){
    var st = press[i]; if(!st) return;
    if(st.holdTimer) clearTimeout(st.holdTimer);
    if(st.repTimer) clearTimeout(st.repTimer);
    if(st.zone) st.zone.classList.remove("pressing");
    delete press[i];
  }
  function endAllPress(){ Object.keys(press).forEach(function(k){ endPress(+k); }); }

  function wireZone(zone, i, dir){
    zone.addEventListener("pointerdown", function(e){ startPress(e,i,dir); });
    zone.addEventListener("pointerup", function(){ endPress(i); });
    zone.addEventListener("pointercancel", function(){ endPress(i); });
    zone.addEventListener("keydown", function(e){
      if(e.key===" "||e.key==="Enter"){ e.preventDefault(); if(S.phase!=="rolling") applyChange(i,dir); }
    });
  }
  window.addEventListener("pointerup", endAllPress);
  window.addEventListener("pointercancel", endAllPress);
  window.addEventListener("blur", endAllPress);

  // ---- timer -----------------------------------------------------------
  function currentTurn(){
    return S.turnAccum + ((!S.paused && S.segStart!=null) ? (Date.now()-S.segStart) : 0);
  }
  function fmt(ms){
    var s = Math.floor(ms/1000);
    var h = Math.floor(s/3600);
    var m = Math.floor((s%3600)/60);
    var ss = s%60;
    var p = function(x){ return (x<10?"0":"")+x; };
    return h>0 ? (h+":"+p(m)+":"+p(ss)) : (m+":"+p(ss));
  }
  // Rotate the coin's pointer so it aims at the active player's tile. The tile
  // position only changes on turn pass / layout change, so we cache the last
  // pointed-at index and only re-measure (forcing reflow) when it actually
  // changes or when forced (resize / board rebuild).
  var pointerActive = null;
  var pointerDeg = null; // accumulated angle (unbounded) so we always rotate the short way
  function updatePointer(force){
    var a = (S.phase==="playing" && S.active!=null) ? S.active : null;
    el.pointer.classList.toggle("hidden", a===null);
    if(a===null){ pointerActive=null; return; }
    if(!force && a===pointerActive) return;
    pointerActive = a;
    var t = tileEls[a]; if(!t) return;
    var cr = el.coin.getBoundingClientRect();
    var tr = t.tile.getBoundingClientRect();
    var dx = (tr.left+tr.width/2) - (cr.left+cr.width/2);
    var dy = (tr.top+tr.height/2) - (cr.top+cr.height/2);
    var target = Math.atan2(dy, dx) * 180 / Math.PI + 90; // arrow's rest position points up
    if(pointerDeg===null){
      pointerDeg = target;
    } else {
      // step by the shortest signed angle so the arrow eases to the next seat
      // instead of unwinding the long way round when the ring wraps
      var delta = ((target - pointerDeg) % 360 + 540) % 360 - 180;
      pointerDeg += delta;
    }
    el.pointer.style.transform = "rotate(" + pointerDeg + "deg)";
  }

  function updateCoin(){
    var rolling = S.phase==="rolling";
    el.coin.classList.toggle("hidden", rolling);
    el.coin.classList.toggle("paused", S.paused);
    if(S.active!=null && S.players[S.active]){
      var hex = PALETTE[S.players[S.active].color] || "#555";
      document.documentElement.style.setProperty("--active", hex);
      // tint the glass coin with the active player's colour so the whole circle
      // — not just the thin ring — reads clearly as that player's colour
      var cr=parseInt(hex.slice(1,3),16), cg=parseInt(hex.slice(3,5),16), cb=parseInt(hex.slice(5,7),16);
      var mix=function(c,d){ return Math.round(c*0.34 + d*0.66); };
      el.coin.style.background = "rgba("+mix(cr,16)+","+mix(cg,18)+","+mix(cb,22)+",0.74)";
    } else {
      document.documentElement.style.setProperty("--active", "#555");
      el.coin.style.background = "";
    }
    var ct = (S.phase==="playing" && S.active!=null) ? currentTurn() : 0;
    el.turn.textContent = fmt(ct);
    var tot = (S.active!=null ? (S.totals[S.active]||0) : 0) + ct;
    el.total.textContent = fmt(tot);
    updatePointer(false);
  }
  setInterval(function(){ if(S.phase==="playing") updateCoin(); }, CFG.tickMs);
  // Track the visible viewport height so the layout (and the centred coin) fit
  // the area not covered by the browser bar, and recompute on any change.
  function setAppHeight(){
    var vv = window.visualViewport;
    if(vv) document.documentElement.style.setProperty("--app-h", vv.height + "px");
  }
  function onViewportChange(){ setAppHeight(); computeSeatOrder(); applyTileOrientation(); updatePointer(true); }
  window.addEventListener("resize", onViewportChange);
  if(window.visualViewport){
    window.visualViewport.addEventListener("resize", onViewportChange);
    window.visualViewport.addEventListener("scroll", onViewportChange);
  }
  setAppHeight();

  function bankCurrent(){
    if(S.active!=null) S.totals[S.active] = (S.totals[S.active]||0) + currentTurn();
  }
  function passTurn(){
    if(S.phase!=="playing" || S.active==null) return;
    bankCurrent();
    S.active = nextIndex(S.active);
    S.turnAccum = 0;
    S.segStart = S.paused ? null : Date.now();
    updateTiles(); updateCoin(); save();
  }
  function togglePause(){
    if(S.phase!=="playing") return;
    if(!S.paused){
      if(S.segStart!=null){ S.turnAccum += Date.now()-S.segStart; S.segStart=null; }
      S.paused = true;
    } else {
      S.paused = false;
      S.segStart = Date.now();
    }
    updateTiles(); updateCoin(); save();
  }

  // coin gestures: tap = pass turn, double tap = pause, hold 1s = open settings
  var pendingPass = null;
  var coinHoldTimer = null, coinHeld = false;
  el.coin.addEventListener("pointerdown", function(e){
    coinHeld = false;
    coinHoldTimer = setTimeout(function(){
      coinHeld = true;
      if(pendingPass){ clearTimeout(pendingPass); pendingPass = null; }
      if(navigator.vibrate){ try{ navigator.vibrate(18); }catch(_){} }
      openSheet();
    }, 1000);
  });
  function coinHoldCancel(){ if(coinHoldTimer){ clearTimeout(coinHoldTimer); coinHoldTimer = null; } }
  el.coin.addEventListener("pointerup", function(e){
    coinHoldCancel();
    if(coinHeld){ coinHeld = false; return; }   // the hold already opened settings
    if(S.phase!=="playing") return;
    if(pendingPass){ clearTimeout(pendingPass); pendingPass=null; togglePause(); }
    else { pendingPass = setTimeout(function(){ pendingPass=null; passTurn(); }, CFG.dblMs); }
  });
  el.coin.addEventListener("pointercancel", coinHoldCancel);
  el.coin.addEventListener("pointerleave", coinHoldCancel);

  // ---- who-goes-first roll --------------------------------------------
  var rollTimers = [];
  var rollResult = { first:0, second:0 };
  function clearRollTimers(){ rollTimers.forEach(clearTimeout); rollTimers = []; }

  function startRoll(){
    S.phase = "rolling"; S.active = null;
    el.board.classList.add("rolling");
    el.board.removeAttribute("data-first-player");
    el.board.removeAttribute("data-second-player");
    for(var i=0;i<S.count;i++){
      tileEls[i].tile.classList.remove("spot","first");
      tileEls[i].badge.classList.remove("show","second");
      tileEls[i].badge.textContent = "";
    }
    updateCoin();
    el.hint.classList.add("show");
    el.skip.classList.add("show");

    var first = pickFirst();
    var second = nextIndex(first);
    rollResult = { first:first, second:second };

    if(reduceMotion){
      finishRoll(first, second);
      return;
    }
    var order = directionOrder();
    var startPos = 0;
    var dist = (order.indexOf(first) - startPos + S.count) % S.count;
    var totalSteps = S.count*2 + dist;
    var k = 0, prev = null, acc = 0;
    function step(){
      if(prev!=null) tileEls[prev].tile.classList.remove("spot");
      var idx = order[(startPos+k)%S.count];
      tileEls[idx].tile.classList.add("spot");
      prev = idx;
      if(navigator.vibrate){ try{ navigator.vibrate(7); }catch(_){} }
      if(k>=totalSteps){ finishRoll(first, second); return; }
      var frac = k/totalSteps;
      var delay = Math.round(CFG.repMin + (300-CFG.repMin)*frac*frac) + 30;
      k++;
      var tmr = setTimeout(step, delay);
      rollTimers.push(tmr);
    }
    step();
  }

  function finishRoll(first, second){
    clearRollTimers();
    for(var i=0;i<S.count;i++) tileEls[i].tile.classList.remove("spot");
    tileEls[first].tile.classList.add("first");
    tileEls[first].badge.textContent = "1st";
    tileEls[first].badge.classList.add("show");
    el.board.setAttribute("data-first-player", String(first));
    el.board.setAttribute("data-second-player", String(second));

    var revealSecond = function(){
      tileEls[second].badge.textContent = "2nd";
      tileEls[second].badge.classList.add("show","second");
    };
    var begin = function(){
      el.board.classList.remove("rolling");
      tileEls[first].tile.classList.remove("first");
      tileEls[second].badge.classList.remove("show","second");
      tileEls[first].badge.classList.remove("show");
      el.hint.classList.remove("show");
      el.skip.classList.remove("show");
      S.active = first;
      S.phase = "playing";
      S.paused = false;
      S.turnAccum = 0;
      S.segStart = Date.now();
      updateTiles(); updateCoin(); save();
    };

    if(reduceMotion){ revealSecond(); rollTimers.push(setTimeout(begin, 200)); return; }
    rollTimers.push(setTimeout(revealSecond, 560));
    rollTimers.push(setTimeout(begin, 1450));
  }

  el.skip.addEventListener("click", function(){
    if(S.phase!=="rolling") return;
    clearRollTimers();
    finishRoll(rollResult.first, rollResult.second);
  });

  // ---- reset -----------------------------------------------------------
  function resetGame(withRoll){
    endAllPress();
    clearRollTimers();
    S.life = []; S.totals = []; deltaSum = [];
    for(var i=0;i<S.count;i++){ S.life[i]=S.startingLife; S.totals[i]=0; deltaSum[i]=0; if(fadeTimer[i]) clearTimeout(fadeTimer[i]); }
    S.active=null; S.paused=false; S.turnAccum=0; S.segStart=null; S.phase="idle";
    for(var j=0;j<S.count;j++){ if(tileEls[j]){ tileEls[j].delta.classList.remove("show"); } }
    updateTiles();
    if(withRoll && !CFG.nosplash){
      startRoll();
    } else {
      S.active = pickFirst();
      S.phase = "playing";
      S.segStart = Date.now();
      el.board.setAttribute("data-first-player", String(S.active));
      el.board.setAttribute("data-second-player", String(nextIndex(S.active)));
      updateTiles(); updateCoin();
    }
    save();
  }

  // ---- settings sheet --------------------------------------------------
  function openSheet(){ el.overlay.classList.add("show"); el.sheet.classList.add("show"); }
  function closeSheet(){ el.overlay.classList.remove("show"); el.sheet.classList.remove("show"); armResetBtn(false); }

  el.overlay.addEventListener("click", closeSheet);
  el.done.addEventListener("click", closeSheet);

  // count segmented
  [2,3,4,5,6].forEach(function(n){
    var b = document.createElement("button");
    b.textContent = String(n);
    b.setAttribute("data-testid","count-"+n);
    b.setAttribute("data-count", String(n));
    b.addEventListener("click", function(){ setCount(n); });
    el.countSeg.appendChild(b);
  });
  function setCount(n){
    if(n===S.count){ return; }
    S.count = n;
    // grow/shrink players preserving existing
    var p = S.players.slice(0,n);
    for(var i=p.length;i<n;i++){ p.push({ name:"Player "+(i+1), color: COLOR_ORDER[i % COLOR_ORDER.length] }); }
    S.players = p;
    syncSettingsUI();
    buildBoard();
    buildPlayerRows();
    resetGame(true);
  }

  // direction segmented
  el.dirSeg.querySelectorAll("button").forEach(function(b){
    b.addEventListener("click", function(){
      S.direction = b.getAttribute("data-dir");
      syncSettingsUI();
      if(S.phase==="playing"){ S.active = S.active; } // direction affects future passes
      save();
    });
  });

  // starting life
  el.lifeDec.addEventListener("click", function(){ S.startingLife = Math.max(1, S.startingLife-1); syncSettingsUI(); save(); });
  el.lifeInc.addEventListener("click", function(){ S.startingLife = S.startingLife+1; syncSettingsUI(); save(); });

  // delta fade time (seconds); 1s..60s
  function stepDeltaFade(deltaSec){
    var sec = Math.round(S.deltaFadeMs/1000) + deltaSec;
    sec = Math.max(1, Math.min(60, sec));
    S.deltaFadeMs = sec*1000;
    syncSettingsUI(); save();
  }
  el.deltaDec.addEventListener("click", function(){ stepDeltaFade(-1); });
  el.deltaInc.addEventListener("click", function(){ stepDeltaFade(+1); });

  function buildPlayerRows(){
    el.playerList.innerHTML = "";
    for(var i=0;i<S.count;i++){
      (function(i){
        var row = document.createElement("div"); row.className="prow";
        var head = document.createElement("div"); head.className="head";

        var sw = document.createElement("button");
        sw.className="swatch"; sw.setAttribute("data-testid","player-"+i+"-color");
        sw.style.background = PALETTE[S.players[i].color];
        sw.setAttribute("aria-label","Change Player "+(i+1)+" colour");

        var name = document.createElement("input");
        name.className="name"; name.type="text"; name.value=S.players[i].name;
        name.setAttribute("data-testid","player-"+i+"-name");
        name.addEventListener("input", function(){
          S.players[i].name = name.value || ("Player "+(i+1));
          if(tileEls[i]){
            tileEls[i].dec.setAttribute("aria-label","Decrease "+S.players[i].name+" life");
            tileEls[i].inc.setAttribute("aria-label","Increase "+S.players[i].name+" life");
          }
          save();
        });

        var picker = document.createElement("div"); picker.className="picker";
        picker.setAttribute("data-testid","player-"+i+"-picker");
        COLOR_ORDER.forEach(function(cn){
          var opt=document.createElement("button");
          opt.className="opt"+(S.players[i].color===cn?" sel":"");
          opt.style.background=PALETTE[cn];
          opt.setAttribute("data-testid","player-"+i+"-swatch-"+cn);
          opt.setAttribute("aria-label",cn);
          opt.addEventListener("click", function(){
            S.players[i].color = cn;
            sw.style.background = PALETTE[cn];
            applyTileColor(i);
            if(S.active===i) updateCoin();
            picker.querySelectorAll(".opt").forEach(function(o){ o.classList.remove("sel"); });
            opt.classList.add("sel");
            save();
          });
          picker.appendChild(opt);
        });

        sw.addEventListener("click", function(){ picker.classList.toggle("open"); });

        head.appendChild(sw); head.appendChild(name);
        row.appendChild(head); row.appendChild(picker);
        el.playerList.appendChild(row);
      })(i);
    }
  }

  // reset with two-tap confirm
  var resetArmed = false, resetTimer = null;
  function armResetBtn(on){
    resetArmed = on;
    el.reset.classList.toggle("confirm", on);
    el.reset.textContent = on ? "Tap again to confirm" : "Reset game";
    el.reset.setAttribute("data-confirm", on ? "true" : "false");
    if(resetTimer){ clearTimeout(resetTimer); resetTimer=null; }
    if(on){ resetTimer = setTimeout(function(){ armResetBtn(false); }, 3000); }
  }
  el.reset.addEventListener("click", function(){
    if(!resetArmed){ armResetBtn(true); return; }
    armResetBtn(false);
    closeSheet();
    resetGame(true);
  });

  function syncSettingsUI(){
    el.countSeg.querySelectorAll("button").forEach(function(b){
      b.classList.toggle("on", +b.getAttribute("data-count")===S.count);
    });
    el.dirSeg.querySelectorAll("button").forEach(function(b){
      b.classList.toggle("on", b.getAttribute("data-dir")===S.direction);
    });
    el.lifeVal.textContent = String(S.startingLife);
    el.deltaVal.textContent = Math.round(S.deltaFadeMs/1000) + "s";
  }

  // ---- boot ------------------------------------------------------------
  function boot(){
    var saved = load();
    if(saved){
      S.count = saved.count || 4;
      S.startingLife = saved.startingLife || 40;
      S.deltaFadeMs = (typeof saved.deltaFadeMs==="number" && saved.deltaFadeMs>0) ? saved.deltaFadeMs : CFG.fadeMs;
      S.ptrCycleSec = (typeof saved.ptrCycleSec==="number" && saved.ptrCycleSec>0) ? saved.ptrCycleSec : 6;
      S.direction = saved.direction==="ccw" ? "ccw" : "cw";
      S.players = (saved.players && saved.players.length)? saved.players : defaultPlayers(S.count);
      while(S.players.length < S.count) S.players.push({name:"Player "+(S.players.length+1), color:COLOR_ORDER[S.players.length%COLOR_ORDER.length]});
      S.life = (saved.life && saved.life.length===S.count)? saved.life.slice() : S.players.map(function(){return S.startingLife;});
      S.totals = (saved.totals && saved.totals.length===S.count)? saved.totals.slice() : S.players.map(function(){return 0;});
      deltaSum = S.players.map(function(){return 0;});
      S.active = (typeof saved.active==="number") ? saved.active : 0;
      S.paused = !!saved.paused;
      S.turnAccum = saved.turnAccum || 0;
      S.segStart = S.paused ? null : Date.now();
      S.phase = "playing";
      syncSettingsUI(); buildBoard(); buildPlayerRows(); updateCoin();
    } else {
      S.players = defaultPlayers(S.count);
      deltaSum = S.players.map(function(){return 0;});
      syncSettingsUI(); buildBoard(); buildPlayerRows();
      resetGame(true);
    }
  }

  // minimal debug handle (read-only-ish)
  window.MTG = {
    version:"1.0.0",
    get state(){ return JSON.parse(JSON.stringify({count:S.count,direction:S.direction,active:S.active,paused:S.paused,phase:S.phase,life:S.life,totals:S.totals,startingLife:S.startingLife,deltaFadeMs:S.deltaFadeMs,ptrCycleSec:S.ptrCycleSec})); },
    currentTurnMs:function(){ return currentTurn(); }
  };

  boot();
})();
</script>
</body>
</html>
